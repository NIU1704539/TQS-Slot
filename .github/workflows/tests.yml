name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit console launcher
        run: curl -fsSL -o junit-console.jar https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      - name: Compile
        run: |
          mkdir -p bin bin-test
          javac -d bin $(find src -name "*.java")
          javac -d bin-test -cp bin:junit-console.jar $(find test -name "*.java")

      - name: Run tests
        run: java -ea -jar junit-console.jar execute -cp bin:bin-test --scan-classpath bin-test
